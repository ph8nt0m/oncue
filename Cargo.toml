[package]
name = "oncue"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "An attention queue for your AI coding agents: see which sessions are waiting on you."
license = "MIT"
repository = "https://github.com/ph8nt0m/oncue"
readme = "README.md"
keywords = ["claude", "codex", "agents", "tui", "monitor"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
libc = "0.2.189"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"
